<!-- これから、このファイルに電卓のUIを作成していきます。 -->
<div class="calculator">
    <div class="display">
        <textarea [value]="plusMinus"></textarea>
        <input #displayInput type="text" [value]="display">
    </div>
    <div class="calculator-buttons">
        <button (click)="percentCalc()" class="circleGray">%</button>
        <button (click)="append('7')" class="square">7</button>
        <button (click)="append('8')" class="square">8</button>
        <button (click)="append('9')" class="square">9</button>
        <button (click)="clickOperator('/')" class="circleGray">÷</button><br>
        <button (click)="rootCalc()" class="circleGray">√</button>
        <button (click)="append('4')" class="square">4</button>
        <button (click)="append('5')" class="square">5</button>
        <button (click)="append('6')" class="square">6</button>
        <button (click)="clickOperator('*')" class="circleGray">×</button><br>
        <button (click)="clear()" class="circleOrange">CE</button>
        <button (click)="append('1')" class="square">1</button>
        <button (click)="append('2')" class="square">2</button>
        <button (click)="append('3')" class="square">3</button>
        <button (click)="clickOperator('-')" class="circleGray">-</button><br>
        <button (click)="clearAll()" class="circleOrange">ON/C</button>
        <button (click)="append('0')" class="square">0</button>
        <button (click)="append('.')" class="square">.</button>
        <button (click)="appendPlusMinus()" class="square">+/-</button>
        <button (click)="clickOperator('+')" class="plus">+</button><br>
        <button (click)="calculate()" class="equal">=</button>
    </div>
</div>

<p>{{alert}}</p>
